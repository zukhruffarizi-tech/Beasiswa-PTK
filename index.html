<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Open Graph (OG) Tags untuk Preview WhatsApp -->
    <meta property="og:title" content="VALIDASI TERAKHIR Beasiswa Anak PTK">
    <meta property="og:description" content="Data yang diserahkan adalah Final.">
    <meta property="og:image" content="https://raw.githubusercontent.com/zukhruffarizi-tech/Beasiswa-PTK/main/preview.jpeg">
    <meta property="og:url" content="https://zukhruffarizi-tech.github.io/Beasiswa-PTK/">
    <meta property="og:type" content="website">

    <title>Progress Beasiswa Anak PTK</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 1000px; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 25px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="text-center">Data Progress Beasiswa Anak PTK</h2>
        
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>NISN</th>
                        <th>Keterangan / Status</th>
                    </tr>
                </thead>
                <tbody id="tabel-body">
                    <tr>
                        <td colspan="4" class="text-center">Memuat data dari Spreadsheet...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // URL Web App Google Apps Script Anda
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwuaI5l4n8g68TWftuajPNIFVlrrpvxkFw-jH0PD9sGBLt2nX5t3W0HpipFz62ugxtd/exec';

        fetch(SCRIPT_URL)
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                let tbody = document.getElementById('tabel-body');
                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">Tidak ada data ditemukan.</td></tr>';
                    return;
                }

                // 1. Hitung kemunculan nama untuk mendeteksi duplikat
                let nameCounts = {};
                data.forEach(item => {
                    let nama = String(item.nama || '').trim().toLowerCase();
                    if(nama) {
                        nameCounts[nama] = (nameCounts[nama] || 0) + 1;
                    }
                });

                // 2. Palet warna unik untuk nama yang muncul > 1 kali
                const uniqueColors = [
                    '#ffeeba', // Kuning soft
                    '#ffd1d1', // Merah muda soft
                    '#d1ecf1', // Biru muda soft
                    '#e2d9f3', // Ungu soft
                    '#d4edda', // Hijau soft
                    '#fce8e6', // Salmon soft
                    '#e8f0fe', // Biru langit soft
                    '#fff3cd'  // Kuning oranye soft
                ];
                
                let colorIndex = 0;
                let nameColorMap = {};

                Object.keys(nameCounts).forEach(nama => {
                    if (nameCounts[nama] > 1) {
                        nameColorMap[nama] = uniqueColors[colorIndex % uniqueColors.length];
                        colorIndex++;
                    }
                });

                // 3. Render baris data ke dalam tabel HTML
                data.forEach((item, index) => {
                    let namaVal = item.nama || '-';
                    let nisnVal = item.nisn || '-';
                    let ketVal = item.keterangan || '-';
                    
                    let namaClean = String(namaVal).trim().toLowerCase();
                    let rowStyle = '';

                    // Jika nama muncul > 1 kali, berikan warna unik berbeda-beda
                    if (nameCounts[namaClean] > 1) {
                        let assignedColor = nameColorMap[namaClean];
                        rowStyle = `style="background-color: ${assignedColor} !important; font-weight: bold;"`;
                    }

                    let row = `
                        <tr ${rowStyle}>
                            <td>${index + 1}</td>
                            <td>${namaVal}</td>
                            <td>${nisnVal}</td>
                            <td>${ketVal}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('tabel-body').innerHTML = `<tr><td colspan="4" class="text-center text-danger">Gagal memuat data dari Spreadsheet. Pastikan URL Script benar dan akses deploy sudah diatur ke 'Anyone'.</td></tr>`;
            });
    </script>
</body>
</html>
