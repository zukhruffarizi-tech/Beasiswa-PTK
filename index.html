<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Open Graph (OG) Tags untuk Preview WhatsApp -->
    <meta property="og:title" content="Progress Beasiswa Anak PTK">
    <meta property="og:description" content="Sistem pemantauan progress beasiswa anak PTK secara real-time.">
    <meta property="og:image" content="https://raw.githubusercontent.com/zukhruffarizi-tech/Beasiswa-PTK/main/preview.jpeg">
    <meta property="og:url" content="https://zukhruffarizi-tech.github.io/Beasiswa-PTK/">
    <meta property="og:type" content="website">

    <title>Progress Beasiswa Anak PTK</title>
    
    <!-- Bootstrap CSS untuk tampilan tabel yang rapi dan responsif -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 {
            margin-bottom: 25px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="text-center">Data Progress Beasiswa Anak PTK</h2>
        
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>NISN</th>
                        <th>Keterangan / Status</th>
                    </tr>
                </thead>
                <tbody id="tabel-body">
                    <tr>
                        <td colspan="4" class="text-center">Memuat data dari Spreadsheet...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script untuk Mengambil Data & Memberikan Warna Unik pada Nama Ganda -->
    <script>
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP APPS SCRIPT ANDA
        const SCRIPT_URL = 'MASUKKAN_URL_WEB_APP_APPS_SCRIPT_ANDA_DISINI';

        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                // 1. Hitung berapa kali masing-masing nama muncul (untuk deteksi duplikat)
                let nameCounts = {};
                data.forEach(item => {
                    // Cari properti yang mengandung kata 'nama'
                    let keyNama = Object.keys(item).find(k => k.includes('nama')) || 'nama';
                    let nama = String(item[keyNama] || '').trim().toLowerCase();
                    if(nama) {
                        nameCounts[nama] = (nameCounts[nama] || 0) + 1;
                    }
                });

                // 2. Siapkan palet warna unik untuk nama yang muncul > 1 kali
                const uniqueColors = [
                    '#ffeeba', // Kuning soft
                    '#ffd1d1', // Merah muda soft
                    '#d1ecf1', // Biru muda soft
                    '#e2d9f3', // Ungu soft
                    '#d4edda', // Hijau soft
                    '#fce8e6', // Salmon soft
                    '#e8f0fe'  // Biru langit soft
                ];
                
                let colorIndex = 0;
                let nameColorMap = {};

                Object.keys(nameCounts).forEach(nama => {
                    if (nameCounts[nama] > 1) {
                        nameColorMap[nama] = uniqueColors[colorIndex % uniqueColors.length];
                        colorIndex++;
                    }
                });

                // 3. Render data ke dalam tabel HTML
                let tbody = document.getElementById('tabel-body');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">Tidak ada data ditemukan.</td></tr>';
                    return;
                }

                data.forEach((item, index) => {
                    // Cari key secara fleksibel mengantisipasi perbedaan penamaan kolom
                    let keyNama = Object.keys(item).find(k => k.includes('nama')) || 'nama';
                    let keyNisn = Object.keys(item).find(k => k.includes('nisn')) || 'nisn';
                    
                    // Ambil key kolom lain untuk keterangan (misal: status, keterangan, progress, dll)
                    let otherKeys = Object.keys(item).filter(k => !k.includes('nama') && !k.includes('nisn') && k !== '_rawRow');
                    let keterangan = otherKeys.length > 0 ? item[otherKeys[0]] : '-';

                    let namaVal = item[keyNama] || '';
                    let nisnVal = item[keyNisn] || '-';
                    
                    let namaClean = String(namaVal).trim().toLowerCase();
                    let rowStyle = '';

                    // Jika nama muncul > 1 kali, berikan warna latar belakang unik
                    if (nameCounts[namaClean] > 1) {
                        let assignedColor = nameColorMap[namaClean];
                        rowStyle = `style="background-color: ${assignedColor} !important; font-weight: bold;"`;
                    }

                    let row = `
                        <tr ${rowStyle}>
                            <td>${index + 1}</td>
                            <td>${namaVal}</td>
                            <td>${nisnVal}</td>
                            <td>${keterangan}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Gagal memuat data:', error);
                document.getElementById('tabel-body').innerHTML = `<tr><td colspan="4" class="text-center text-danger">Gagal memuat data. Periksa kembali URL Script Anda.</td></tr>`;
            });
    </script>
</body>
</html>
